name: Generate GitHub Stats SVGs

on:
  # Executa todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite execução manual pela aba Actions
  workflow_dispatch:
  # Executa ao fazer push no repositório de perfil
  push:
    branches: [main]

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. GitHub Stats card ──────────────────────────────────────
      - name: Generate GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg
          user: dataPalacio
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: America/Recife
          config_display: large
          # Paleta escura alinhada ao README
          config_output: svg
          extras_css: |
            :root {
              --color-background: #0d1117;
              --color-border: #21262d;
              --color-primary: #58a6ff;
              --color-text-primary: #c9d1d9;
              --color-text-secondary: #8b949e;
            }

      # ── 3. Top Languages card ─────────────────────────────────────
      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-langs.svg
          user: dataPalacio
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          config_timezone: America/Recife
          config_output: svg

      # ── 4. Streak (hábito de contribuições) ───────────────────────
      - name: Generate Contribution Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-streak.svg
          user: dataPalacio
          base: ""
          plugin_habits: yes
          plugin_habits_from: 365
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: America/Recife
          config_output: svg

      # ── 5. Commit automático dos SVGs gerados ─────────────────────
      - name: Commit updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: atualiza stats SVGs [skip ci]"
          file_pattern: "*.svg"
