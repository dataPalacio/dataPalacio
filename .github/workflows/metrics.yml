name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. GitHub Stats card ──────────────────────────────────────
      - name: Generate GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg
          user: dataPalacio
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: America/Recife
          config_display: large
          config_output: svg
          extras_css: |
            :root {
              --color-background: #0d1117;
              --color-border: #21262d;
              --color-primary: #58a6ff;
              --color-text-primary: #c9d1d9;
              --color-text-secondary: #8b949e;
            }

      # ── 3. Top Languages card ─────────────────────────────────────
      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-langs.svg
          user: dataPalacio
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          config_timezone: America/Recife
          config_output: svg

      # ── 4. Calendário de contribuições (isocalendar) ──────────────
      # CORRIGIDO: plugin_habits removido — bug ativo sem fix mergeado.
      # Causa: mudança na API do GitHub quebrou a leitura de commits
      # (Cannot destructure property 'author'/'committer' of 'undefined'),
      # gerando "Unexpected error" no SVG gerado.
      # plugin_isocalendar é estável: exibe o calendário de contribuições
      # do ano completo sem depender da API de commits afetada.
      - name: Generate Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-streak.svg
          user: dataPalacio
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Recife
          config_output: svg

      # ── 5. Commit automático dos SVGs gerados ─────────────────────
      - name: Commit updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: atualiza stats SVGs [skip ci]"
          file_pattern: "*.svg"
