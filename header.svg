<svg fill="none" viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container {
          width: 900px;
          height: 200px;
          background: linear-gradient(135deg, #0d1117 0%, #161b22 40%, #1a2332 70%, #0d1117 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          font-family: 'Segoe UI', sans-serif;
        }

        /* Animated background particles */
        .particles {
          position: absolute;
          top: 0; left: 0;
          width: 100%; height: 100%;
          pointer-events: none;
        }
        .dot {
          position: absolute;
          width: 3px; height: 3px;
          border-radius: 50%;
          background: rgba(88, 166, 255, 0.4);
          animation: float 6s infinite ease-in-out;
        }
        .dot:nth-child(1)  { top: 15%; left: 8%;   animation-delay: 0s;   animation-duration: 5s; }
        .dot:nth-child(2)  { top: 70%; left: 15%;  animation-delay: 1s;   animation-duration: 7s; }
        .dot:nth-child(3)  { top: 30%; left: 25%;  animation-delay: 2s;   animation-duration: 4s; }
        .dot:nth-child(4)  { top: 80%; left: 40%;  animation-delay: 0.5s; animation-duration: 6s; }
        .dot:nth-child(5)  { top: 10%; left: 55%;  animation-delay: 3s;   animation-duration: 5s; }
        .dot:nth-child(6)  { top: 60%; left: 65%;  animation-delay: 1.5s; animation-duration: 8s; }
        .dot:nth-child(7)  { top: 40%; left: 80%;  animation-delay: 2.5s; animation-duration: 4s; }
        .dot:nth-child(8)  { top: 85%; left: 90%;  animation-delay: 0.2s; animation-duration: 6s; }
        .dot:nth-child(9)  { top: 20%; left: 92%;  animation-delay: 4s;   animation-duration: 7s; }
        .dot:nth-child(10) { top: 50%; left: 50%;  animation-delay: 1.8s; animation-duration: 5s; }

        /* Grid lines for data aesthetic */
        .grid-line {
          position: absolute;
          background: rgba(88, 166, 255, 0.06);
        }
        .grid-h { width: 100%; height: 1px; }
        .grid-v { width: 1px; height: 100%; }
        .grid-h:nth-child(1) { top: 25%; }
        .grid-h:nth-child(2) { top: 50%; }
        .grid-h:nth-child(3) { top: 75%; }
        .grid-v:nth-child(4) { left: 20%; }
        .grid-v:nth-child(5) { left: 40%; }
        .grid-v:nth-child(6) { left: 60%; }
        .grid-v:nth-child(7) { left: 80%; }

        @keyframes float {
          0%, 100% { transform: translateY(0px) scale(1);   opacity: 0.4; }
          50%       { transform: translateY(-12px) scale(1.5); opacity: 0.8; }
        }

        /* Glow orbs */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(40px);
          animation: pulse 4s infinite ease-in-out;
        }
        .orb-1 {
          width: 200px; height: 200px;
          background: rgba(88, 166, 255, 0.08);
          top: -50px; left: -30px;
          animation-delay: 0s;
        }
        .orb-2 {
          width: 150px; height: 150px;
          background: rgba(63, 185, 80, 0.06);
          bottom: -30px; right: 100px;
          animation-delay: 2s;
        }
        .orb-3 {
          width: 180px; height: 180px;
          background: rgba(139, 92, 246, 0.07);
          top: -20px; right: -20px;
          animation-delay: 1s;
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1);    opacity: 0.6; }
          50%       { transform: scale(1.15); opacity: 1; }
        }

        /* Main content */
        .content {
          position: relative;
          z-index: 10;
          text-align: center;
        }

        .greeting {
          font-size: 13px;
          letter-spacing: 4px;
          text-transform: uppercase;
          color: rgba(88, 166, 255, 0.7);
          margin-bottom: 6px;
          animation: slideDown 0.8s ease-out;
        }

        .name {
          font-size: 40px;
          font-weight: 700;
          letter-spacing: 1px;
          background: linear-gradient(90deg, #58a6ff 0%, #79c0ff 40%, #a5d6ff 70%, #58a6ff 100%);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: slideDown 0.8s ease-out 0.1s both, shimmer 3s linear infinite;
        }

        .tagline {
          font-size: 14px;
          color: rgba(201, 209, 217, 0.65);
          margin-top: 8px;
          letter-spacing: 2px;
          animation: slideDown 0.8s ease-out 0.2s both;
        }

        .accent {
          color: rgba(63, 185, 80, 0.9);
          -webkit-text-fill-color: rgba(63, 185, 80, 0.9);
        }

        @keyframes shimmer {
          to { background-position: 200% center; }
        }
        @keyframes slideDown {
          from { opacity: 0; transform: translateY(-15px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        /* Bottom wave */
        .wave-container {
          position: absolute;
          bottom: 0; left: 0;
          width: 100%; height: 30px;
          overflow: hidden;
        }
        .wave {
          position: absolute;
          bottom: 0;
          width: 200%;
          height: 30px;
          animation: wave 8s linear infinite;
        }
        .wave-1 { animation-duration: 8s;  opacity: 0.3; }
        .wave-2 { animation-duration: 12s; opacity: 0.15; animation-delay: -4s; }
        @keyframes wave {
          from { transform: translateX(0); }
          to   { transform: translateX(-50%); }
        }
      </style>

      <div class="container">
        <!-- Background layers -->
        <div class="grid-line grid-h" style="top:25%"></div>
        <div class="grid-line grid-h" style="top:50%"></div>
        <div class="grid-line grid-h" style="top:75%"></div>
        <div class="grid-line grid-v" style="left:20%"></div>
        <div class="grid-line grid-v" style="left:40%"></div>
        <div class="grid-line grid-v" style="left:60%"></div>
        <div class="grid-line grid-v" style="left:80%"></div>

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="particles">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div>
        </div>

        <!-- Main text -->
        <div class="content">
          <div class="greeting">✦ Data Analyst ✦</div>
          <div class="name">Gustavo Palacio</div>
          <div class="tagline">Engenheiro Civil <span class="accent">→</span> Analista de Dados · Natal, RN 🌊</div>
        </div>

        <!-- Wave at bottom -->
        <div class="wave-container">
          <svg class="wave wave-1" viewBox="0 0 1200 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,15 C200,30 400,0 600,15 C800,30 1000,0 1200,15 L1200,30 L0,30 Z" fill="rgba(88,166,255,0.3)"/>
          </svg>
          <svg class="wave wave-2" viewBox="0 0 1200 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,20 C300,5 600,25 900,10 C1050,3 1150,20 1200,15 L1200,30 L0,30 Z" fill="rgba(63,185,80,0.2)"/>
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
